name: Verify ReorderLens
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Reproduce Vercel's automatically injected metadata in build/runtime checks.
      NEXT_PUBLIC_VERCEL_ENV: preview
      NEXT_PUBLIC_VERCEL_URL: synthetic-ci.vercel.app
      AI_ASSISTANT_ENABLED: "false"
      OPENROUTER_SAMPLE_EVALUATION: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - run: corepack pnpm release:preflight
      - name: Anonymous production smoke
        shell: bash
        run: |
          corepack pnpm start --port 3100 > /tmp/reorderlens-smoke.log 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          corepack pnpm release:smoke
      - run: corepack pnpm audit --prod
